version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chat_app_1:
    build: .
    ports:
     - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
    - ./chat.db:/app/chat.db

  chat_app_2:
    build: .
    ports:
     - "8001:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
    - ./chat.db:/app/chat.db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - chat_app_1
      - chat_app_2
    volumes:
     - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
redis_data: